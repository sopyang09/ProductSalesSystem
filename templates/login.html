
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ProductSales</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f3fa;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 350px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(84, 37, 138, 0.12);
            text-align: center;
        }

        .login-logo {
            color: #54258a;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .login-card h2 {
            color: #54258a;
            margin-bottom: 25px;
        }

        .login-card label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: #49365e;
            font-weight: bold;
        }

        .login-card input {
            width: 100%;
            height: 45px;
            padding: 0 12px;
            margin-bottom: 20px;
            border: 1px solid #ded4eb;
            border-radius: 7px;
            box-sizing: border-box;
        }

        .login-card input:focus {
            outline: none;
            border-color: #54258a;
        }

        .login-button {
            width: 100%;
            height: 45px;
            background: #54258a;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #3e176b;
        }

        .login-message {
            color: #d62828;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="login-logo">ProductSales</div>
        <p class="login-subtitle">Management System</p>

        <h2>Admin Login</h2>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="login-message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/login">

            <label for="username">Username</label>
            <input
                type="text"
                name="username"
                id="username"
                placeholder="Enter username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                name="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

    </div>

</body>
</html>
